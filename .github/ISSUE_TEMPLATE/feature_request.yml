name: Feature request
description: Suggest an improvement to the addon
title: "[Feature]: "
body:
  - type: textarea
    id: use_case
    attributes:
      label: What would you like to do?
      description: Describe the problem or use case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Describe how the feature might work, including relevant screens or workflows.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context (optional)
