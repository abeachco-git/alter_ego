name: Probe public GW2 daily categories
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gw2-daily-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read public API category identifiers
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          print("UTC NOW", datetime.datetime.now(datetime.timezone.utc).isoformat(), flush=True)
          for path in ('/v2/achievements/categories/88','/v2/achievements/categories/475','/v2/achievements/categories/477','/v2/achievements/daily'):
              url = 'https://api.guildwars2.com' + path
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':'AlterEgo API diagnostics/1.0', 'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req, timeout=20) as res:
                      payload=json.load(res)
                      print(path,'status',res.status,'date',res.headers.get('Date'),'last-mod',res.headers.get('Last-Modified'),'cache',res.headers.get('Cache-Control'),flush=True)
                      if isinstance(payload,dict) and isinstance(payload.get('achievements'),list):
                          ids=payload['achievements']
                          print('CATEGORY',path,'count',len(ids),'ids',sorted(ids),flush=True)
                      else:
                          print('DATA',str(payload)[:500],flush=True)
              except Exception as ex:
                  print('ERROR',path,type(ex).__name__,str(ex),flush=True)
          PY
