name: MetaBattle Live Integration

on:
  workflow_dispatch:
  push:
    branches: [main, feature/save-and-compare-retrieved-sets, experiment/composable-loadouts]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'include/**'
      - 'lib/**'
      - 'CMakeLists.txt'
      - 'AlterEgo.def'
      - '.github/workflows/metabattle-live.yml'

# Deliberately independent of DLL compilation and release artifacts.
jobs:
  live-import:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install test dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++ curl ca-certificates
      - name: Fetch MetaBattle live pages for parser verification
        run: |
          mkdir -p /tmp/metabattle-live
          for spec in \
            'reaper|Reaper_-_Power_Greatsword_Reaper' \
            'harbinger|Harbinger_-_Boon_DPS_Condi_Harbinger_Open_World' \
            'chronomancer|Chronomancer_-_Power_DPS' \
            'mechanist|Mechanist_-_Condi_DPS' \
            'scrapper|Scrapper_-_Power_Scrapper' \
            'holosmith|Holosmith_-_Condi_Holo'; do
            file="${spec%%|*}"
            slug="${spec#*|}"
            curl -fLsS --retry 2 --connect-timeout 10 --max-time 35 --retry-max-time 90 -A 'Mozilla/5.0' \
              "https://metabattle.com/wiki/Build:${slug}" \
              -o "/tmp/metabattle-live/${file}.html" || true
            wc -c "/tmp/metabattle-live/${file}.html" || true
          done
      - name: Upload MetaBattle live HTML snapshots
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: MetaBattle-Live-HTML
          path: /tmp/metabattle-live/*.html
          if-no-files-found: ignore
      - name: Compile MetaBattle regression test
        run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/metabattle_import.cpp -o /tmp/metabattle_import
      - name: Verify all six live MetaBattle equipment imports
        run: |
          for name in reaper harbinger chronomancer mechanist scrapper holosmith; do
            test -s "/tmp/metabattle-live/${name}.html" || {
              echo "MetaBattle live page not available: ${name}" >&2
              exit 1
            }
          done
          /tmp/metabattle_import /tmp/metabattle-live
