name: Vendored dependency inventory

on:
  workflow_dispatch:
  push:
    branches: [main, experiment/composable-loadouts]
  schedule:
    - cron: '23 10 * * 2'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate inventory and generate reports
        run: python3 tools/dependency_inventory.py --snapshot
      - name: Query OSV advisory database
        run: python3 tools/dependency_inventory.py --osv
      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-reports
          path: dependency-reports/
          if-no-files-found: error

  submit:
    needs: inventory
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve verified snapshot
        uses: actions/download-artifact@v8
        with:
          name: dependency-reports
          path: dependency-reports
      - name: Submit snapshot to GitHub dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input dependency-reports/github-snapshot.json
