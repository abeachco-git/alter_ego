name: Inspect Snow Crows markup (temporary)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/snowcrows-inspect.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Examine Snow Crows gear traits and skills
        run: |
          python3 - <<'PY'
          import urllib.request,re,html
          url="https://snowcrows.com/builds/raids/mesmer/condition-boon-chronomancer-dueling-staff-scepter-pistol"
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          raw=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          print('LEN',len(raw))
          for pattern in [r'\[&[A-Za-z0-9+/=]+\]',r'data-armory-embed="[^"]+"',r'data-armory-ids="[^"]+"',r'data-armory-\\d+-(?:stat|upgrades)="[^"]+"',r'data-clipboard[^>]+',r'data-build[^>]+',r'data-(?:trait|skill)[^>]+',r'copy[^>]{0,70}(?:Build|Link)',r'Chronomancer[^<]{0,150}']:
              hits=re.findall(pattern,raw,re.I)
              from collections import Counter
              print('\nPATTERN',pattern,'COUNT',len(hits),'TOP',Counter(hits).most_common(35))
          for anchor in ['id="gearset"','id="skills"','Build Template','Traits &amp; Skills','data-armory-ids="39619"']:
              i=raw.find(anchor)
              print('\nAREA',anchor,i)
              if i>=0:print(re.sub(r'\s+',' ',raw[max(0,i-350):i+12500])[:12500])
          PY
