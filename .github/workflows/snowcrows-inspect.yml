name: Live Snow Crows parser smoke (temporary)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/snowcrows-inspect.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download example page
        run: |
          python3 - <<'PY'
          import urllib.request
          url="https://snowcrows.com/builds/raids/mesmer/condition-boon-chronomancer-dueling-staff-scepter-pistol"
          request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          body=urllib.request.urlopen(request,timeout=30).read()
          open('/tmp/snow.html','wb').write(body)
          print('Downloaded bytes:',len(body))
          PY
      - name: Parse actual Snow Crows build using importer
        run: |
          cat > /tmp/live_smoke.cpp <<'CPP'
          #include "SnowCrowsImport.h"
          #include <fstream>
          #include <iostream>
          #include <iterator>
          int main() {
            std::ifstream file("/tmp/snow.html",std::ios::binary);
            std::string html((std::istreambuf_iterator<char>(file)),{});
            AlterEgo::SnowCrows::Page p;
            std::string error;
            const std::string url="https://snowcrows.com/builds/raids/mesmer/condition-boon-chronomancer-dueling-staff-scepter-pistol";
            if (!AlterEgo::SnowCrows::Parse(url,html,p,error)) {
              std::cerr << "PARSE FAILED: " << error << "\n";
              return 1;
            }
            std::cout << "NAME " << p.name << "\n";
            std::cout << "PROF " << p.profession << " MODE " << p.gameMode << "\n";
            std::cout << "SLOTS " << p.gear.size() << " RELIC " << p.relicId << " RUNE " << p.runeId << "\n";
            for(const auto& [key,g] : p.gear) {
              std::cout << "GEAR " << key << " stat=" << g.statId << " item=" << g.itemId
                        << " weapon=" << g.weaponType << " upgrades=";
              for(auto id:g.upgrades) std::cout << id << ",";
              std::cout << "\n";
            }
            for(const auto& infusion:p.infusions)
              std::cout << "INF " << infusion.itemId << " count=" << infusion.count << "\n";
            for(const auto& spec:p.specs){
              std::cout << "SPEC " << spec.id << " traits=";
              for(auto id:spec.traits) std::cout << id << ",";
              std::cout << "\n";
            }
            std::cout << "SKILLS ";
            for(auto id:p.skills) std::cout << id << ",";
            std::cout << "\n";
            return p.gear.size() >= 15 && p.infusions.size() == 2 &&
                   p.runeId != 0 && p.relicId != 0 ? 0 : 2;
          }
          CPP
          g++ -std=c++17 -O2 -I src /tmp/live_smoke.cpp -o /tmp/live_smoke
          /tmp/live_smoke
