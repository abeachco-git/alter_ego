name: Build Alter Ego Windows DLL (UCRT)

on:
  workflow_dispatch:
    inputs:
      stock_toolchain:
        description: 'Fallback: install toolchain from Debian instead of GHCR'
        type: boolean
        default: false
      wiki_refresh:
        description: 'Force bounded Wiki reference refresh'
        type: boolean
        default: false
      wiki_diagnostic:
        description: 'Run optional Wiki connectivity diagnostic'
        type: boolean
        default: false
      public_api_diagnostic:
        description: 'Run optional public catalog API sample probe'
        type: boolean
        default: false
  push:
    branches: [main, feature/save-and-compare-retrieved-sets, experiment/composable-loadouts]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - 'include/**'
      - 'lib/**'
      - 'assets/**'
      - 'CMakeLists.txt'
      - 'AlterEgo.def'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.txt'
      - '.github/workflows/windows-dll.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    # Main and the legacy feature branch retain the stock path until rollout.
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ github.ref_name == 'experiment/composable-loadouts' && !inputs.stock_toolchain && format('ghcr.io/{0}/alter-ego-ucrt-toolchain:trixie-exp-v1', github.repository_owner) || 'debian:trixie' }}
      credentials:
        username: ${{ github.ref_name == 'experiment/composable-loadouts' && !inputs.stock_toolchain && github.actor || '' }}
        password: ${{ github.ref_name == 'experiment/composable-loadouts' && !inputs.stock_toolchain && secrets.GITHUB_TOKEN || '' }}
    env:
      CCACHE_DIR: /tmp/alter-ego-ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install matching UCRT cross-compiler (stock fallback)
        if: github.ref_name != 'experiment/composable-loadouts' || inputs.stock_toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             cmake make file python3 python3-pil ca-certificates ccache g++ g++-mingw-w64-ucrt64             gcc-mingw-w64-ucrt64 binutils-mingw-w64-ucrt64
      - name: Verify toolchain and choose safe build parallelism
        run: |
          x86_64-w64-mingw32ucrt-g++ --version
          g++ --version
          cmake --version
          python3 -c "import PIL"
          python3 - <<'PY'
          import os
          from pathlib import Path
          mib = 1024 * 1024
          cpus = len(os.sched_getaffinity(0))
          try:
              quota, period = Path('/sys/fs/cgroup/cpu.max').read_text().split()
              if quota != 'max':
                  cpus = min(cpus, max(1, int(quota) // int(period)))
          except (OSError, ValueError):
              pass
          available = next(int(line.split()[1]) * 1024 for line in
                           Path('/proc/meminfo').read_text().splitlines()
                           if line.startswith('MemAvailable:'))
          try:
              limit = Path('/sys/fs/cgroup/memory.max').read_text().strip()
              if limit != 'max':
                  used = int(Path('/sys/fs/cgroup/memory.current').read_text())
                  available = min(available, max(0, int(limit) - used))
          except (OSError, ValueError):
              pass
          # Reserve memory for the runner/linker; budget 3 GiB per compiler.
          jobs = max(1, min(4, cpus, (available - 1536*mib) // (3072*mib)))
          print(f'CPU slots: {cpus}; available memory: {available//mib} MiB; build jobs: {jobs}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'AE_BUILD_JOBS={jobs}\n')
          PY
      - name: Diagnose GW2 Wiki connectivity
        if: github.event_name == 'workflow_dispatch' && inputs.wiki_diagnostic
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          import urllib.error
          tests = [
              ("Wiki HTML", "https://wiki.guildwars2.com/wiki/Wizard%27s_Vault", None),
              ("Wiki API", "https://wiki.guildwars2.com/api.php?action=query&meta=siteinfo&format=json", "query"),
              ("Wiki API Parse", "https://wiki.guildwars2.com/api.php?action=parse&page=Wizard%27s_Vault&prop=text&format=json", "parse"),
              ("Wiki Semantic API", "https://wiki.guildwars2.com/api.php?action=ask&query=%5B%5BCategory%3AItems%5D%5D%7Climit%3D1&format=json", "query"),
              ("ArenaNet API (Control)", "https://api.guildwars2.com/v2/build", "id"),
          ]
          for label, url, expected in tests:
              start = time.monotonic()
              print(f"===== {label} =====", flush=True)
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "AlterEgo-Diagnostic/1.0"})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      body = response.read(4 * 1024 * 1024)
                      print(f"HTTP {response.status}; bytes={len(body)}; seconds={time.monotonic()-start:.3f}")
                      if expected is None:
                          valid = b"mw-parser-output" in body and b"Wizard" in body
                      else:
                          obj = json.loads(body)
                          valid = expected in obj and "error" not in obj
                          if label == "Wiki Semantic API":
                              valid = valid and bool(obj["query"].get("results"))
                          if label == "Wiki API Parse":
                              valid = valid and bool(obj["parse"].get("text", {}).get("*"))
                      print(f"Payload: {'VALID' if valid else 'UNEXPECTED'}")
                      if not valid:
                          print(repr(body[:250]))
              except urllib.error.HTTPError as exc:
                  print(f"HTTP {exc.code}: {exc.reason}; seconds={time.monotonic()-start:.3f}")
              except Exception as exc:
                  print(f"FAILED: {type(exc).__name__}: {exc}")
          PY
      - name: Verify public catalog API payloads
        if: (github.event_name == 'workflow_dispatch' && inputs.public_api_diagnostic) || github.event.head_commit.message == 'Persist companion catalogs and refresh reference metadata'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request
          base = "https://api.guildwars2.com"
          def get(path):
              req = urllib.request.Request(base+path, headers={"User-Agent":"AlterEgo-Diagnostic/1.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  data = json.load(r)
                  print(path, "HTTP", r.status, "records", len(data))
                  return data
          legends = get("/v2/legends?ids=all&v=2019-12-19T00:00:00.000Z")
          assert all({"id","code","swap"} <= l.keys() for l in legends)
          print("Legend identities:", [(l["id"], l["code"], l["swap"]) for l in legends])
          swaps = get("/v2/skills?ids="+",".join(str(i) for i in sorted({l["swap"] for l in legends})))
          print("Legend names:", [(s["id"],s["name"]) for s in swaps])
          pets = get("/v2/pets?ids=all")
          assert pets and all({"id","name"} <= p.keys() for p in pets)
          print("Pet sample:", pets[0]["id"],pets[0]["name"])
          stats = get("/v2/itemstats?ids=all")
          print("Stat sample:",stats[0])
          dyes = get("/v2/colors?ids=all")
          print("Dye sample:",dyes[0]["id"],dyes[0]["name"],dyes[0]["base_rgb"])
          PY
      - name: Restore Wiki reference state
        uses: actions/cache/restore@v5
        with:
          path: .wiki-reference-state
          key: ae-wiki-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ae-wiki-v2-${{ github.ref_name }}-
      - name: Refresh daily-eligible Wiki build resources
        run: |
          mkdir -p .wiki-reference-state
          args=""
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.wiki_refresh }}" = "true" ]; then args="--force"; fi
          python3 tools/wiki_resources.py --state .wiki-reference-state/rotations.json --refresh $args
      - name: Save Wiki reference state
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .wiki-reference-state
          key: ae-wiki-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Cache compiler outputs, never final executables or test results.
      - name: Restore compiler cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/alter-ego-ccache
          key: ae-ccache-v1-${{ runner.os }}-${{ runner.arch }}-trixie-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ae-ccache-v1-${{ runner.os }}-${{ runner.arch }}-trixie-
      - name: Initialize compiler cache statistics
        run: |
          ccache --version
          ccache --zero-stats
      - name: Run required offline regression tests
        run: |
          cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-tests --parallel "$AE_BUILD_JOBS"
          ctest --test-dir build-tests --output-on-failure
      - name: Exercise untrusted parsers under ASan and UBSan
        run: |
          flags="-std=c++17 -O1 -g -fno-omit-frame-pointer -fno-pie -fsanitize=address,undefined -fno-sanitize-recover=all -Ilib"
          # Cache compilation units, not the linked executable or test result.
          ccache g++ $flags -c tests/untrusted_fuzz.cpp -o build-tests/untrusted_fuzz.o
          ccache g++ $flags -c src/ChatLink.cpp -o build-tests/untrusted_ChatLink.o
          g++ -no-pie -fsanitize=address,undefined -fno-sanitize-recover=all build-tests/untrusted_fuzz.o build-tests/untrusted_ChatLink.o -o build-tests/untrusted-fuzz
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 build-tests/untrusted-fuzz
      - name: Run reproducible SQLite benchmark
        run: python3 tools/benchmark_sqlite.py --output sqlite-benchmark.json
      - name: Report native test and sanitizer compiler cache statistics
        run: |
          ccache --show-stats
          ccache --zero-stats
      - name: Configure Windows release build
        run: |
          cmake -S . -B build -DAE_WIKI_STATE="$PWD/.wiki-reference-state/rotations.json" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache             -DCMAKE_CXX_FLAGS="-mcrtdll=ucrtbase" -DCMAKE_C_FLAGS="-mcrtdll=ucrtbase"
      - name: Compile Windows DLL
        run: cmake --build build --parallel "$AE_BUILD_JOBS"
      - name: Verify embedded fixed UI assets
        run: |
          python3 tools/verify_embedded_icons.py build/AlterEgo.dll
          test -s build/embedded_icons.rc
          grep -q 'AE_9000008' build/embedded_icons.rc
          grep -q 'AE_9200008' build/embedded_icons.rc
          grep -q 'AE_9100001' build/embedded_icons.rc
          grep -q 'AE_68326' build/embedded_icons.rc
          test "$(grep -c '^AE_' build/embedded_icons.rc)" -ge 80
          test "$(grep -c '^AE_15' build/embedded_icons.rc)" -ge 27
          test "$(grep -c '^AE_20' build/embedded_icons.rc)" -ge 27
      - name: Verify embedded Windows build version
        run: python3 tools/verify_build_version.py build/AlterEgo.dll
      - name: Verify Windows x64 UCRT DLL
        run: |
          test -s build/AlterEgo.dll
          file build/AlterEgo.dll
          x86_64-w64-mingw32ucrt-objdump -f build/AlterEgo.dll | grep -E 'pei-x86-64|pe-x86-64'
          x86_64-w64-mingw32ucrt-objdump -p build/AlterEgo.dll | grep -Ei 'DLL Name: (ucrtbase.dll|api-ms-win-crt-)'
          if x86_64-w64-mingw32ucrt-objdump -p build/AlterEgo.dll | grep -qi 'DLL Name: msvcrt.dll'; then
            echo "Wrong CRT imported (MSVCRT)" >&2
            exit 1
          fi
      - name: Report Windows compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Verify distribution notices
        run: |
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.txt
          grep -Fq 'SQLite — public domain' THIRD_PARTY_NOTICES.txt
          test ! -e assets/inter_regular.ttf
          test ! -e assets/OFL.txt
          test ! -e src/AlterEgoResources.rc.in
      - name: Upload DLL
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AlterEgo-UCRT-Windows-x64
          path: |
            build/AlterEgo.dll
            build/AlterEgo.map
            sqlite-benchmark.json
            .wiki-reference-state/rotations.json
            LICENSE
            THIRD_PARTY_NOTICES.txt
          include-hidden-files: true
          if-no-files-found: error
      - name: Save compiler cache
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: /tmp/alter-ego-ccache
          key: ae-ccache-v1-${{ runner.os }}-${{ runner.arch }}-trixie-${{ github.run_id }}-${{ github.run_attempt }}
