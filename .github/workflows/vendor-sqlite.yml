name: Vendor verified SQLite (experimental branch only)
on:
  push:
    branches: [experiment/composable-loadouts]
    paths: ['.github/workflows/vendor-sqlite.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    if: github.ref == 'refs/heads/experiment/composable-loadouts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: experiment/composable-loadouts
      - name: Download and verify official amalgamation
        run: python3 tools/vendor_sqlite.py
      - name: Commit only the three verified upstream files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lib/sqlite/sqlite3.c lib/sqlite/sqlite3.h lib/sqlite/sqlite3ext.h
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Vendor official SQLite 3.54.1 amalgamation"
          git push origin HEAD:refs/heads/experiment/composable-loadouts
