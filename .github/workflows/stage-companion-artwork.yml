name: Stage companion artwork for review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install image tooling
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      - name: Stage artwork for offline review
        run: /usr/bin/python3 tools/stage_companion_icons.py companion-artwork
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: companion-artwork-review
          path: companion-artwork
          if-no-files-found: error
