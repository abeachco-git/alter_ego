name: Temporary MetaBattle HTML inspection
on:
  push:
    paths:
      - '.github/workflows/metabattle-probe.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live sources
        run: |
          python3 - <<'PY'
          import urllib.request,re
          req=urllib.request.Request('https://metabattle.com/wiki/Build:Chronomancer_-_Power_DPS',headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
          s=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          for start,end in [('id="Skill_Bar"','id="Template_Code"'),('id="Template_Code"','id="Specializations"'),('id="Equipment"','id="Consumables"')]:
           a=s.find(start);b=s.find(end,a+len(start)); chunk=s[a:b]
           print('SECTION',start,'length',len(chunk))
           print('FRAGMENT',chunk[:2600])
           print('EMBEDS', re.findall(r'<[^>]*data-armory-embed="(?:skills|items|specializations)"[^>]*>(?:.*?)',chunk,re.S)[:5])
           if start=='id="Equipment"':
            print('SLOTS',re.findall(r'<div class="equipment-slot"[^>]*>.*?</small></div>',chunk,re.S)[:45])
          PY
