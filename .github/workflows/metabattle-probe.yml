name: Temporary MetaBattle HTML inspection
on:
  push:
    paths:
      - '.github/workflows/metabattle-probe.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live sources
        run: |
          python3 - <<'PY'
          import urllib.request,re,html
          urls={
           'page':'https://metabattle.com/wiki/Build:Chronomancer_-_Power_DPS',
           'raw':'https://metabattle.com/wiki/index.php?title=Build%3AChronomancer_-_Power_DPS&action=raw',
           'wiki':'https://wiki.guildwars2.com/wiki/Ascended_weapon',
          }
          for key,url in urls.items():
           try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept':'text/html'})
            with urllib.request.urlopen(req, timeout=25) as r: s=r.read(2000000).decode('utf-8','replace'); print('SOURCE',key,r.status,len(s))
            if key=='page':
             for word in ('equipment','equip','trait','skill','specializ','template','stat','relic','rune','infusion','meta'):
              matches=list(re.finditer(word,s,re.I))
              print('MATCH',word,len(matches),[(m.start(),html.unescape(re.sub(r'\\s+',' ',s[max(0,m.start()-60):m.start()+170]))[:230]) for m in matches[:8]])
             for word in ('Head','Shoulders','Sigil','Relic of','Zojja','Berserker'):
              pos=s.find(word);print('RAWFRAGMENT',word,pos,s[max(0,pos-450):pos+750].replace('\\n',' ')[:1200])
            elif key=='wiki':
             for word in ('Zojja','Yassith','Verata','Zehtuka'):
              pos=s.find(word);print('WIKI',word,pos,s[max(0,pos-450):pos+450].replace('\\n',' ')[:900])
            else: print('WIKITEXT',s[:14000])
           except Exception as e: print('ERROR',key,type(e).__name__,str(e))
          PY
