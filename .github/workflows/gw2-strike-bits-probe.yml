name: Temporary check live raid event IDs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gw2-strike-bits-probe.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public raid encounter list
        run: |
          python3 - <<'PY'
          import json,urllib.request,time
          def api(path):
            req=urllib.request.Request("https://api.guildwars2.com"+path+"?ae_probe="+str(int(time.time()*1000)),headers={"User-Agent":"AlterEgo probe"})
            with urllib.request.urlopen(req,timeout=15) as resp:
              data=json.load(resp)
              print(path,"HTTP",resp.status,flush=True)
              return data
          try:
            root=api("/v2/raids")
            print("Raid list",root,flush=True)
            for rid in root:
              data=api("/v2/raids/"+rid)
              print("RAID",rid,[(w.get('id'),[(e.get('id'),e.get('type')) for e in w.get('events',[])]) for w in data.get('wings',[])],flush=True)
          except Exception as e:
            print("ERROR",str(e),flush=True)
          PY